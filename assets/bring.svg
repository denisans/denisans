<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 190" width="1180" height="190" role="img" aria-label="Product thinking, Engineering mindset, Collaboration, Delivery focus">
<rect x="0" y="0" width="280" height="190" rx="14" fill="#0F1A2E" stroke="#1E2D4A"/>
<rect x="0" y="0" width="280" height="5" rx="2.5" fill="#38BDF8"/>
<circle cx="36" cy="48" r="14" fill="#38BDF8" fill-opacity=".18"/><circle cx="36" cy="48" r="5" fill="#38BDF8"/>
<text x="62" y="55" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EDF7">Product thinking</text>
<text x="24" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">Frame the problem,</text><text x="24" y="136" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">define the opportunity,</text><text x="24" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">prioritize what matters.</text>
<rect x="300" y="0" width="280" height="190" rx="14" fill="#0F1A2E" stroke="#1E2D4A"/>
<rect x="300" y="0" width="280" height="5" rx="2.5" fill="#818CF8"/>
<circle cx="336" cy="48" r="14" fill="#818CF8" fill-opacity=".18"/><circle cx="336" cy="48" r="5" fill="#818CF8"/>
<text x="362" y="55" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EDF7">Engineering mindset</text>
<text x="324" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">Speak the language of</text><text x="324" y="136" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">developers and QA; turn needs</text><text x="324" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">into clear requirements.</text>
<rect x="600" y="0" width="280" height="190" rx="14" fill="#0F1A2E" stroke="#1E2D4A"/>
<rect x="600" y="0" width="280" height="5" rx="2.5" fill="#F59E0B"/>
<circle cx="636" cy="48" r="14" fill="#F59E0B" fill-opacity=".18"/><circle cx="636" cy="48" r="5" fill="#F59E0B"/>
<text x="662" y="55" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EDF7">Collaboration</text>
<text x="624" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">Align stakeholders, keep</text><text x="624" y="136" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">teams unblocked, report</text><text x="624" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">progress clearly.</text>
<rect x="900" y="0" width="280" height="190" rx="14" fill="#0F1A2E" stroke="#1E2D4A"/>
<rect x="900" y="0" width="280" height="5" rx="2.5" fill="#34D399"/>
<circle cx="936" cy="48" r="14" fill="#34D399" fill-opacity=".18"/><circle cx="936" cy="48" r="5" fill="#34D399"/>
<text x="962" y="55" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EDF7">Delivery focus</text>
<text x="924" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">Ship, learn from</text><text x="924" y="136" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">feedback, and iterate</text><text x="924" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3C2">with intention.</text>
</svg>
