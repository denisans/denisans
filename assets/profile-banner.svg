<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Denisans — Product-minded PM and Engineer</title>
  <desc id="desc">A dark navy banner with teal accents and a product-minded engineering message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="70" r="190" fill="#2dd4bf" opacity=".08"/>
  <circle cx="1090" cy="250" r="125" fill="#60a5fa" opacity=".08"/>
  <path d="M800 0h400v320H920z" fill="url(#accent)" opacity=".08"/>
  <rect x="72" y="72" width="5" height="176" rx="2.5" fill="url(#accent)"/>
  <text x="104" y="130" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="3">DENISANS</text>
  <text x="106" y="178" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="500">PRODUCT-MINDED PM · ENGINEER</text>
  <text x="106" y="222" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Turning user needs into thoughtful digital products.</text>
  <rect x="106" y="248" width="74" height="4" rx="2" fill="url(#accent)"/>
</svg>
