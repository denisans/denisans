<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Denisans — Product-minded builder</title>
  <desc id="desc">A modern dark navy profile banner with a teal-to-blue accent and product-minded builder message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#142b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#cbd5e1" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1010" cy="95" r="185" fill="#2dd4bf" opacity=".09"/>
  <circle cx="1110" cy="270" r="150" fill="#60a5fa" opacity=".08"/>
  <path d="M845 0h355v320H965z" fill="url(#accent)" opacity=".07"/>
  <rect x="76" y="72" width="4" height="176" rx="2" fill="url(#accent)"/>
  <text x="106" y="120" fill="#99f6e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="3">PRODUCT THINKING × ENGINEERING CRAFT</text>
  <text x="104" y="177" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="700">DENISANS</text>
  <text x="106" y="218" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Turning complex problems into useful products.</text>
  <rect x="106" y="248" width="92" height="4" rx="2" fill="url(#accent)"/>
</svg>
