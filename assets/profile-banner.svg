<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Denisans — Product-minded PM and Engineer</title>
  <desc id="desc">Modern startup-style GitHub profile banner for a product-minded PM and engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#132a3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="76" r="190" fill="#2dd4bf" opacity=".08"/>
  <circle cx="1110" cy="260" r="140" fill="#60a5fa" opacity=".08"/>
  <path d="M850 0h350v320H910z" fill="url(#accent)" opacity=".07"/>
  <rect x="80" y="74" width="4" height="176" rx="2" fill="url(#accent)"/>
  <text x="108" y="118" fill="#99f6e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">PRODUCT-MINDED PM + ENGINEER</text>
  <text x="104" y="180" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800">DENISANS</text>
  <text x="106" y="220" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Building useful products with clarity and momentum.</text>
  <rect x="106" y="248" width="110" height="4" rx="2" fill="url(#accent)"/>
</svg>
