<defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DB2AD" stop-opacity="0"/><stop offset=".5" stop-color="#7DB2AD"/><stop offset="1" stop-color="#7DB2AD" stop-opacity="0"/></linearGradient>
