<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Delivery focus: Turning ideas into usable product progress.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18273A"/><stop offset="1" stop-color="#141F2B"/></linearGradient>
<linearGradient id="rl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DB2AD"/><stop offset="1" stop-color="#7DB2AD" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="200" rx="18"/></clipPath>
<style>@keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } } @keyframes rise { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform:none } }
@keyframes br { 0%,100% { opacity:.3 } 50% { opacity:.65 } }
.rl { transform-box: fill-box; transform-origin: left; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) .2s both } .a { animation: rise .9s ease-out .4s both } .b { animation: rise .9s ease-out .7s both } .r { animation: br 8s ease-in-out infinite } @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style></defs>
<g clip-path="url(#c)"><rect width="1200" height="200" fill="url(#bg)"/>
<g fill="none" stroke="#7DB2AD" stroke-width="1"><circle class="r" cx="1080" cy="100" r="150" opacity=".3"/><circle class="r" cx="1080" cy="100" r="90" opacity=".3"/></g></g>
<rect x="1" y="1" width="1198" height="198" rx="17" fill="none" stroke="#2C3E50"/>
<text x="60" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA9B9">What I bring</text>
<text class="a" x="60" y="112" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="50" fill="#E9EEF3">Delivery focus</text>
<rect class="rl" x="60" y="130" width="120" height="2" fill="url(#rl)"/>
<text class="b" x="60" y="166" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#9AA9B9">Turning ideas into usable product progress.</text>
</svg>
