<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Denis - Project Manager, Product Manager, Business Analyst">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#14213D"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1B2A47" stroke-width="1"/></pattern>
  <style>
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    .f1 { animation: float 6s ease-in-out infinite }
    .f2 { animation: float 8s ease-in-out infinite .8s }
    .p  { animation: pulse 3s ease-in-out infinite }
    .p2 { animation: pulse 3s ease-in-out infinite 1.2s }
  </style>
</defs>
<rect width="1200" height="340" rx="18" fill="url(#bg)"/>
<rect width="1200" height="340" rx="18" fill="url(#grid)" opacity=".55"/>
<circle cx="980" cy="150" r="230" fill="url(#glow)"/>
<!-- network art -->
<g stroke="#38BDF8" stroke-opacity=".35" stroke-width="1.5" fill="none">
  <path d="M820 90 L930 160 L1040 100 L1100 210 L960 250 L930 160"/>
  <path d="M820 90 L760 200 L960 250"/>
</g>
<g class="f1"><circle cx="930" cy="160" r="26" fill="#0F1A2E" stroke="url(#ac)" stroke-width="3"/><circle cx="930" cy="160" r="8" fill="#38BDF8"/></g>
<g class="f2"><circle cx="1040" cy="100" r="16" fill="#0F1A2E" stroke="#818CF8" stroke-width="2.5"/><circle cx="1040" cy="100" r="5" fill="#818CF8"/></g>
<circle class="p"  cx="820" cy="90"  r="7" fill="#F59E0B"/>
<circle class="p2" cx="1100" cy="210" r="9" fill="#34D399"/>
<circle class="p"  cx="960" cy="250" r="6" fill="#38BDF8"/>
<circle class="p2" cx="760" cy="200" r="5" fill="#818CF8"/>
<!-- text -->
<rect x="60" y="78" width="6" height="150" rx="3" fill="url(#ac)"/>
<text x="90" y="100" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" letter-spacing="4" fill="#38BDF8">PROJECT / PRODUCT / ANALYSIS</text>
<text x="88" y="178" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="#E6EDF7" letter-spacing="-2">Denis</text>
<text x="90" y="222" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="url(#ac)" font-weight="600">Project Manager  |  Product Manager  |  Business Analyst</text>
<text x="90" y="270" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#8FA3C2">I turn unclear problems into product direction and practical software.</text>
<rect x="90" y="296" width="150" height="4" rx="2" fill="url(#ac)"/>
</svg>
