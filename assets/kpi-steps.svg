<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150" role="img" aria-label="5 steps in my workflow">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A2837"/><stop offset="1" stop-color="#141F2B"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#86BC9F" stop-opacity=".18"/><stop offset="1" stop-color="#86BC9F" stop-opacity="0"/></radialGradient>
<style>
@keyframes comet { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -1000 } }
@keyframes glow { 0%,100% { opacity:.35 } 50% { opacity:.9 } }
@keyframes kb { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(.45) } }
@keyframes acc { 0%,100% { transform: scaleX(1) } 50% { transform: scaleX(2) } }
.cm { animation: comet 12s linear 3.9000000000000004s infinite }
.gl { animation: glow 5s ease-in-out 3.9000000000000004s infinite }
.kb { transform-box: fill-box; transform-origin: bottom center; animation: kb 3.6s ease-in-out infinite }
.ac { transform-box: fill-box; transform-origin: left center; animation: acc 6s ease-in-out 3.9000000000000004s infinite }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style></defs>
<rect width="240" height="150" rx="14" fill="url(#g)"/><rect x=".5" y=".5" width="239" height="149" rx="13.5" fill="none" stroke="#2C3E50"/>
<rect class="cm" x=".75" y=".75" width="238.5" height="148.5" rx="13.25" fill="none" stroke="#86BC9F" stroke-width="1.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="60 940" stroke-opacity=".9"/>
<circle class="gl" cx="62" cy="78" r="58" fill="url(#gl)"/>
<rect class="ac" x="22" y="24" width="20" height="2" fill="#86BC9F"/>
<rect class="kb" style="animation-delay:3.90s" x="196" y="42" width="5" height="10" rx="2.5" fill="#86BC9F" fill-opacity="0.35"/><rect class="kb" style="animation-delay:4.35s" x="205" y="35" width="5" height="17" rx="2.5" fill="#86BC9F" fill-opacity="0.55"/><rect class="kb" style="animation-delay:4.80s" x="214" y="39" width="5" height="13" rx="2.5" fill="#86BC9F" fill-opacity="0.45"/><rect class="kb" style="animation-delay:5.25s" x="223" y="30" width="5" height="22" rx="2.5" fill="#86BC9F" fill-opacity="0.8"/>
<text x="22" y="92" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="58" fill="#E9EEF3">5</text>
<text x="22" y="116" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E9EEF3">Steps in my workflow</text>
<text x="22" y="134" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9AA9B9">From problem to learning</text>
</svg>
