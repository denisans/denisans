<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-label="Cafe_Management, a Java desktop app for cafe operations">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A2837"/><stop offset="1" stop-color="#141F2B"/></linearGradient>
<linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A877" stop-opacity="0"/><stop offset=".5" stop-color="#C9A877" stop-opacity=".22"/><stop offset="1" stop-color="#C9A877" stop-opacity="0"/></linearGradient>
<clipPath id="pc"><rect x="336" y="30" width="204" height="190" rx="12"/></clipPath>
<style>
@keyframes comet { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -1000 } }
@keyframes scan { 0% { transform: translateY(-70px) } 55%,100% { transform: translateY(230px) } }
@keyframes bar { 0%,100% { transform: scaleX(1) } 50% { transform: scaleX(2.2) } }
@keyframes link { 0%,100% { opacity:.85 } 50% { opacity:1 } }
.cm { animation: comet 10s linear 2s infinite }
.sc { animation: scan 7s ease-in-out 2s infinite }
.ab { transform-box: fill-box; transform-origin: left center; animation: bar 6s ease-in-out 2s infinite }
.lk { animation: link 4s ease-in-out 2s infinite }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style></defs>
<rect width="560" height="250" rx="16" fill="url(#g)"/><rect x=".5" y=".5" width="559" height="249" rx="15.5" fill="none" stroke="#2C3E50"/>
