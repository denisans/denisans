<text x="40" y="98" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#C9A877">Java (NetBeans)</text>
<text x="40" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#E9EEF3" fill-opacity=".82">A cafe management desktop app</text><text x="40" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#E9EEF3" fill-opacity=".82">built with Java in NetBeans.</text><text x="40" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#E9EEF3" fill-opacity=".82">Source is kept as archives.</text>
